name: Release

# Push a tag that matches package.json's version (e.g. `npm version patch && git push --follow-tags`).
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.os }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac --x64 --arm64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # No signing certificates are configured yet, so build unsigned installers.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run build && npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

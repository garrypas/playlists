name: Release

# Push a `v*` tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) or create a release with a new tag on GitHub.
# The app is built with the tag's version, whatever package.json says.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.os }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac
            archs: x64 arm64
          - os: windows-latest
            target: --win
            archs: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # No signing certificates are configured yet, so don't look for one. macOS builds are still ad-hoc signed
      # (`build.mac.identity: "-"` in package.json); without any signature, Apple Silicon reports the app as damaged.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The tag is the source of truth for the version; npm rejects tags that aren't valid semver (e.g. v1.2).
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      # The bundled ffmpeg (for BPM and key detection) is a native binary that npm installs for the runner's architecture
      # only, so each architecture is packaged separately with its own binary.
      - name: Build installers
        shell: bash
        run: |
          npm run build
          for arch in ${{ matrix.archs }}; do
            rm -f node_modules/ffmpeg-static/ffmpeg node_modules/ffmpeg-static/ffmpeg.exe
            npm_config_arch=$arch node node_modules/ffmpeg-static/install.js
            npx electron-builder ${{ matrix.target }} --$arch --publish never
          done

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      # Attach to the release if one was already created for this tag (e.g. by hand on GitHub), otherwise create it.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

name: Approval

# Records a maintainer's approval as the required "Approval" commit status, which the `main` ruleset
# (.github/rulesets/main.json) needs before a PR can merge. GitHub doesn't let authors approve their own PRs, so this
# lets any maintainer (anyone with write access, the author included) approve one specific commit by commenting:
#
#   /approve <sha>     (the PR's latest commit, full 40-character SHA: "Copy full SHA" on the commit)
#
# Approval belongs to that commit only: new pushes have no status, so they need approving again. A SHA that isn't the
# PR's latest commit is refused, so code pushed while a maintainer was reviewing can't be approved by mistake. The
# full SHA is required because a short prefix can be matched by a crafted commit.
#
# Comment-triggered runs use this file from `main` and never check out or run PR code; keep it that way
# (.claude/agents/security.md). The job is deliberately not named "Approval", so the only thing with that name is the
# commit status.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  approval:
    name: Record approval
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.event.comment.user.login }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      # Passed as data, never interpolated into the script.
      COMMENT: ${{ github.event.comment.body }}
    steps:
      - name: Set the Approval status
        shell: bash
        run: |
          set -euo pipefail

          react() { gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content="$1" >/dev/null || true; }
          refuse() { echo "$1"; react confused; gh pr comment "$PR" --body "$1"; exit 0; }

          permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          if [[ "$permission" != admin && "$permission" != maintain && "$permission" != write ]]; then
            echo "Only maintainers can approve; ignoring the comment."
            exit 0
          fi

          # The comment must be exactly "/approve <sha>", give or take whitespace.
          read -r command sha extra <<<"$(printf '%s' "$COMMENT" | tr '\r\n\t' '   ')" || true
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [[ "$command" != /approve || -n "${extra:-}" || ! "${sha:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            refuse "Approval not recorded. Comment \`/approve <sha>\` with the full SHA of the PR's latest commit: \`/approve $head\`."
          fi
          if [[ "$head" != "$(printf '%s' "$sha" | tr 'A-F' 'a-f')" ]]; then
            refuse "Approval not recorded: \`${sha}\` isn't this PR's latest commit (\`$head\`). Review the latest changes, then comment \`/approve $head\`."
          fi

          gh api "repos/$GH_REPO/statuses/$head" -f state=success -f context=Approval \
            -f description="Approved by $ACTOR" >/dev/null
          react '+1'
          echo "Approval recorded for $head"
